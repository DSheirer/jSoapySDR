# Builds and tests pull requests. Nothing is published, so pull requests from
# forks run with read-only access.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('dev-{0}', github.sha) }}
