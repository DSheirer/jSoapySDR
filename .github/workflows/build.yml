name: Build

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SDRplay API headers, needed to compile the SDRplay module's runtime loader. Only the headers are used, and only
  # inside this workflow; nothing from the SDRplay API is bundled or published.
  sdrplay-headers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SDRPLAY_API: SDRplay_RSP_API-Linux-3.15.2.run
      SDRPLAY_API_SHA256: ''
    steps:
      - name: Download and extract the SDRplay API headers
        run: |
          # sdrplay.com rejects some clients; try a browser user agent, then wget
          ua="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36"
          ok=""
          for url in "https://www.sdrplay.com/software/$SDRPLAY_API" "https://sdrplay.com/software/$SDRPLAY_API"; do
            code=$(curl -sSL --retry 3 -A "$ua" -o api.run -w "%{http_code}" "$url" || true)
            echo "::notice title=SDRplay download::$url -> HTTP $code ($(stat -c %s api.run 2>/dev/null || echo 0) bytes)"
            if [ "$code" = "200" ] && [ "$(stat -c %s api.run)" -gt 1000000 ]; then ok=1; break; fi
          done
          if [ -z "$ok" ]; then
            wget -q -U "$ua" -O api.run "https://www.sdrplay.com/software/$SDRPLAY_API" && ok=1 || echo "::notice title=SDRplay download::wget failed"
          fi
          [ -n "$ok" ] || { echo "::error::Unable to download $SDRPLAY_API"; exit 1; }
          actual=$(sha256sum api.run | cut -d' ' -f1)
          echo "::notice title=SDRplay API sha256::$SDRPLAY_API $actual"
          if [ -n "$SDRPLAY_API_SHA256" ] && [ "$actual" != "$SDRPLAY_API_SHA256" ]; then
            echo "::error::$SDRPLAY_API sha256 $actual does not match $SDRPLAY_API_SHA256"
            exit 1
          fi
          # makeself archive: extract without running the installer
          sh api.run --noexec --target api > /dev/null || { sudo apt-get install -y -q p7zip-full && 7z x -oapi7 api.run && 7z x -oapi api7/*; }
          mkdir sdrplay-inc
          cp "$(dirname "$(find api -name sdrplay_api.h | head -1)")"/*.h sdrplay-inc/
          ls sdrplay-inc
          grep -m1 "SDRPLAY_API_VERSION " sdrplay-inc/sdrplay_api.h

      - uses: actions/upload-artifact@v7
        with:
          name: sdrplay-api-headers
          path: sdrplay-inc
          retention-days: 1
          if-no-files-found: error

  # Builds the bundled SoapySDR + driver image on each platform and runs the full test suite against it
  natives:
    name: natives (${{ matrix.platform }})
    needs: sdrplay-headers
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: macos-aarch64
            runner: macos-15
          - platform: windows-x86_64
            runner: windows-2025
          - platform: windows-aarch64
            runner: windows-11-arm
            # Temurin has no Windows ARM64 build of JDK 25
            java: microsoft
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: sdrplay-api-headers
          path: native/build/sdrplay-inc

      # Linux images are built in manylinux_2_28 (glibc 2.28) so they run on older distributions
      - name: Build native image (Linux, manylinux_2_28)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" ${{ matrix.image }} bash -euo pipefail -c "
            for attempt in 1 2 3; do dnf install -y -q autoconf automake libtool ninja-build && break; sleep 15; done
            PY=/opt/python/cp312-cp312/bin/python3
            \$PY -m pip install -q 'cmake>=3.28,<4'
            export PATH=/opt/python/cp312-cp312/bin:\$PATH
            \$PY native/build.py --platform ${{ matrix.platform }} --sdrplay-include native/build/sdrplay-inc
            chown -R $(id -u):$(id -g) native natives" 2>&1 | tee native-build.log

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool ninja

      - uses: actions/setup-python@v7
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'

      - name: Build native image (macOS, Windows)
        if: runner.os != 'Linux'
        run: python native/build.py --platform ${{ matrix.platform }} --sdrplay-include native/build/sdrplay-inc 2>&1 | tee native-build.log

      - uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.java || 'temurin' }}
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Test against the bundled image
        run: >
          ./gradlew testDriver test
          -Psoapysdr.prefix=native/build/${{ matrix.platform }}/deps
          -Psoapysdr.sdrplay.include=native/build/sdrplay-inc
          -Psoapysdr.tests.required=true
          -Psoapysdr.tests.bundled=true
          -Pnatives.required=${{ matrix.platform }}
          ${{ runner.os == 'Windows' && '-Psoapysdr.msvc.toolset=v143' || '' }} 2>&1 | tee gradle.log

      - name: Annotate failure
        if: failure()
        shell: bash --noprofile --norc {0}
        run: |
          logs="native-build.log gradle.log"
          logs="$logs $(find native/build \( -name 'vcpkg-manifest-install.log' -o -name 'stdout-*.log' \) 2>/dev/null | tr '\n' ' ')"
          logs="$logs $(find build/test-results -name '*.xml' 2>/dev/null | tr '\n' ' ')"
          py=$(command -v python3 || command -v python)
          "$py" .github/scripts/annotate_failure.py "${{ matrix.platform }}" $logs

      - uses: actions/upload-artifact@v7
        with:
          name: natives-${{ matrix.platform }}
          path: natives/${{ matrix.platform }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports-${{ matrix.platform }}
          path: build/reports/tests

  # Packages one jar containing all six platform images
  jar:
    needs: natives
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: natives-*
          path: natives-download

      - name: Arrange native images
        run: |
          mkdir -p natives
          for dir in natives-download/natives-*; do
            mv "$dir" "natives/$(basename "$dir" | sed 's/^natives-//')"
          done
          ls natives

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build jar with all platform images
        run: ./gradlew jar sourcesJar javadocJar compileExamplesJava -Pnatives.required=all

      - name: Jar contents
        run: unzip -l build/libs/jsoapysdr-*-SNAPSHOT.jar | grep -E 'natives/.*/(bundle.txt|lib|bin)|META-INF/licenses' | head -80

      - uses: actions/upload-artifact@v7
        with:
          name: jsoapysdr-jar
          path: build/libs/*.jar
          if-no-files-found: error

  # Runs the packaged jar on every platform: it must pick, extract and load the right image
  smoke:
    name: smoke (${{ matrix.platform }})
    needs: jar
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: macos-x86_64, runner: macos-15-intel }
          - { platform: macos-aarch64, runner: macos-15 }
          - { platform: windows-x86_64, runner: windows-2025 }
          - { platform: windows-aarch64, runner: windows-11-arm, java: microsoft }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - uses: actions/download-artifact@v8
        with:
          name: jsoapysdr-jar
          path: libs

      - uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.java || 'temurin' }}
          java-version: 25

      - name: Load the bundled image from the jar
        run: |
          jar=$(ls libs/jsoapysdr-*.jar | grep -v -E 'sources|javadoc')
          java --enable-native-access=ALL-UNNAMED -cp "$jar" .github/smoke/Smoke.java ${{ matrix.platform }} 2>&1 | tee smoke.log

      - name: Annotate failure
        if: failure()
        shell: bash --noprofile --norc {0}
        run: |
          py=$(command -v python3 || command -v python)
          "$py" .github/scripts/annotate_failure.py "smoke ${{ matrix.platform }}" smoke.log
