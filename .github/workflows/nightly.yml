# Publishes the rolling "nightly" pre-release from main. Runs when a pull request
# is merged or a commit is pushed to main, or on demand.
name: Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: gradle.properties
          sparse-checkout-cone-mode: false

      - id: version
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          echo "version=${version}-nightly.$(date -u +%Y%m%d).${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jars
          path: jars

      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          (cd jars && sha256sum * > SHA256SUMS)
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly jars/* --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "Nightly $VERSION" \
            --notes "Automated build of main. Not for production use.

          Built from ${GITHUB_SHA}. The bundled native components and their versions are listed in
          [THIRD-PARTY-NOTICES.md](https://github.com/${GH_REPO}/blob/${GITHUB_SHA}/THIRD-PARTY-NOTICES.md)."
