plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'io.github.dsheirer'
version = '0.1.0-SNAPSHOT'
description = 'Java bindings for SoapySDR using the Foreign Function & Memory API'

java {
    // Build with JDK 25, emit Java 22 bytecode (the first release with the final FFM API)
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 22
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all,-restricted', '-Werror']
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    (options as StandardJavadocDocletOptions).addBooleanOption('Xdoclint:all,-missing', true)
}

// ---------------------------------------------------------------------------------------------------------------------
// Bundled native images (natives/<platform>/, produced by native/build.py or downloaded from CI)
//   ./gradlew jar                               packages whichever platform images are present
//   ./gradlew jar -Pnatives.required=all        fails unless all six platform images are present (release builds)
//   -Pnatives.dir=<dir>                         use images from another directory
// ---------------------------------------------------------------------------------------------------------------------

def nativePlatforms = ['linux-x86_64', 'linux-aarch64', 'macos-x86_64', 'macos-aarch64', 'windows-x86_64',
                       'windows-aarch64']
def nativesDir = file(findProperty('natives.dir') ?: 'natives')

tasks.named('processResources', ProcessResources) {
    from(nativesDir) {
        include nativePlatforms.collect { "${it}/**" }
        exclude '*/licenses/**'
        into 'io/github/dsheirer/soapysdr/natives'
    }
    from(nativesDir) {
        include '*/licenses/*'
        eachFile { it.path = "META-INF/licenses/${it.name}" }
        includeEmptyDirs = false
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

def verifyNatives = tasks.register('verifyNatives') {
    group = 'verification'
    description = 'Checks that the bundled native images required by -Pnatives.required are present'
    def required = findProperty('natives.required')
    def dir = nativesDir
    inputs.property('required', required ?: '')
    doLast {
        if (required) {
            def wanted = required == 'all' ? nativePlatforms : required.split(',').collect { it.trim() }
            def missing = wanted.findAll { !new File(dir, "${it}/bundle.txt").isFile() }
            if (missing) {
                throw new GradleException("Missing bundled native images for ${missing} in ${dir}")
            }
        }
    }
}
tasks.named('jar', Jar) {
    dependsOn verifyNatives
    from(rootProject.file('LICENSE')) { into 'META-INF' }
    from(rootProject.file('THIRD-PARTY-NOTICES.md')) { into 'META-INF' }
}

// ---------------------------------------------------------------------------------------------------------------------
// Native test driver (src/test/native) - a deterministic fake SoapySDR device used by TestDriverTest.
// Requires cmake, a C++ compiler and the SoapySDR development headers (-Psoapysdr.prefix=<dir> to find them, e.g.
// native/build/<platform>/deps). Tests that need it are skipped when it is absent unless -Psoapysdr.tests.required=true.
// With -Psoapysdr.sdrplay.include=<SDRplay API headers> it also builds a fake SDRplay API library for the SDRplay tests.
// ---------------------------------------------------------------------------------------------------------------------

def testDriverDir = layout.buildDirectory.dir('native')

tasks.register('configureTestDriver', Exec) {
    group = 'verification'
    description = 'Configures the jsoapytest SoapySDR driver module with CMake'
    inputs.dir('src/test/native')
    outputs.dir(testDriverDir)
    def args = ['cmake', '-S', file('src/test/native').absolutePath, '-B', testDriverDir.get().asFile.absolutePath,
                '-DCMAKE_BUILD_TYPE=Release']
    if (findProperty('soapysdr.prefix')) {
        args << "-DCMAKE_PREFIX_PATH=${file(findProperty('soapysdr.prefix')).absolutePath}"
    }
    if (findProperty('soapysdr.sdrplay.include')) {
        args << "-DJS_SDRPLAY_INCLUDE=${file(findProperty('soapysdr.sdrplay.include')).absolutePath}"
    }
    if (findProperty('soapysdr.msvc.toolset')) {
        args += ['-T', findProperty('soapysdr.msvc.toolset')]
    }
    commandLine args
}

tasks.register('testDriver', Exec) {
    group = 'verification'
    description = 'Builds the jsoapytest SoapySDR driver module used by the unit tests'
    dependsOn 'configureTestDriver'
    commandLine 'cmake', '--build', testDriverDir.get().asFile.absolutePath, '--config', 'Release'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    environment 'SOAPY_SDR_PLUGIN_PATH', new File(testDriverDir.get().asFile, 'modules').absolutePath
    systemProperty 'soapysdr.tests.required', findProperty('soapysdr.tests.required') ?: 'false'
    systemProperty 'soapysdr.tests.bundled', findProperty('soapysdr.tests.bundled') ?: 'false'
    systemProperty 'soapysdr.tests.sdrplay', findProperty('soapysdr.sdrplay.include') ? 'true' : 'false'
    // Point the bundled SDRplay module at the fake SDRplay API library when the test driver build produced one
    def fakeSdrplay = new File(testDriverDir.get().asFile, 'fake-sdrplay-path.txt')
    doFirst {
        if (fakeSdrplay.isFile()) {
            environment 'SOAPY_SDR_SDRPLAY_API', fakeSdrplay.text.trim()
            systemProperty 'soapysdr.tests.fake.sdrplay', 'true'
        }
    }
    // Extract into the build directory so test runs never touch the user's cache
    systemProperty 'soapysdr.natives.dir', layout.buildDirectory.dir('natives-cache').get().asFile.absolutePath
    if (findProperty('soapysdr.library')) {
        systemProperty 'soapysdr.library', findProperty('soapysdr.library')
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

// ---------------------------------------------------------------------------------------------------------------------
// Examples (src/examples/java)
//   ./gradlew probe                         list devices and print their capabilities
//   ./gradlew probe --args="driver=rtlsdr"  probe one device
//   ./gradlew rxPower --args="driver=rtlsdr 162.55e6"
// ---------------------------------------------------------------------------------------------------------------------

sourceSets {
    examples {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

tasks.register('probe', JavaExec) {
    group = 'examples'
    description = 'Prints SoapySDR devices and their capabilities'
    classpath = sourceSets.examples.runtimeClasspath
    mainClass = 'io.github.dsheirer.soapysdr.examples.Probe'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.register('rxPower', JavaExec) {
    group = 'examples'
    description = 'Receives samples and prints the average power'
    classpath = sourceSets.examples.runtimeClasspath
    mainClass = 'io.github.dsheirer.soapysdr.examples.RxPower'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// ---------------------------------------------------------------------------------------------------------------------
// Publishing: ./gradlew publishToMavenLocal, or ./gradlew publish to GitHub Packages (GITHUB_ACTOR / GITHUB_TOKEN)
// ---------------------------------------------------------------------------------------------------------------------

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'jsoapysdr'
            from components.java
            pom {
                name = 'jSoapySDR'
                description = project.description
                url = 'https://github.com/dsheirer/jSoapySDR'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0'
                    }
                }
                developers {
                    developer {
                        id = 'dsheirer'
                        name = 'Dennis Sheirer'
                    }
                }
                scm {
                    url = 'https://github.com/dsheirer/jSoapySDR'
                    connection = 'scm:git:https://github.com/dsheirer/jSoapySDR.git'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/dsheirer/jSoapySDR'
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
